version: '3.8'

services:
  db:
    image: mariadb:10.11
    container_name: news_db
    environment:
      MYSQL_DATABASE: news_db
      MYSQL_USER: news_user
      MYSQL_PASSWORD: news_password
      MYSQL_ROOT_PASSWORD: root_password
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: news_web
    command: sh -c "echo 'Waiting for database...' && until python -c 'import MySQLdb; MySQLdb.connect(host=\"$$DB_HOST\", user=\"$$DB_USER\", passwd=\"$$DB_PASSWORD\", db=\"$$DB_NAME\", port=$$DB_PORT)' 2>/dev/null; do echo 'Database unavailable - sleeping'; sleep 1; done && echo 'Database ready!' && python manage.py migrate --noinput && python manage.py collectstatic --noinput || true && echo 'Starting server...' && python manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DB_HOST=db
      - DB_NAME=news_db
      - DB_USER=news_user
      - DB_PASSWORD=news_password
      - DB_PORT=3306
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  db_data:
  static_volume:
  media_volume:

