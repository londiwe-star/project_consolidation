version: '3.8'

services:
  db:
    image: mariadb:10.11
    container_name: news_db
    environment:
      MYSQL_DATABASE: news_db
      MYSQL_USER: news_user
      MYSQL_PASSWORD: news_password
      MYSQL_ROOT_PASSWORD: root_password
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: news_web
    volumes:
      - .:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DB_HOST=db
      - DB_NAME=news_db
      - DB_USER=news_user
      - DB_PASSWORD=news_password
      - DB_PORT=3306
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    # Use the entrypoint script from Dockerfile which handles migrations

volumes:
  db_data:
  static_volume:
  media_volume:

